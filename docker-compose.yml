version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: issuer-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Deva123
      POSTGRES_DB: issuer_db
      # Performance settings for production
      POSTGRES_SHARED_BUFFERS: 256MB
      POSTGRES_MAX_CONNECTIONS: 200
    volumes:
      # PERSISTENT DATA STORAGE - Data akan tersimpan permanen di sini
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      # Optional: Backup location (uncomment untuk auto-backup)
      # - ./backups:/backups
    networks:
      - issuer-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Logging untuk monitoring
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: issuer-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:Deva123@postgres:5432/issuer_db?schema=public
      # DID Configuration
      ISSUER_DID: did:web:localhost:3001
      ISSUER_NAME: BPJS Kesehatan
      ISSUER_PRIVATE_KEY: ${ISSUER_PRIVATE_KEY:-}
      # API Security
      API_KEY: ${API_KEY:-your-secure-api-key-change-this}
      # Session Secret
      SESSION_SECRET: ${SESSION_SECRET:-your-session-secret-change-this}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - issuer-network
    volumes:
      - ./backend/.well-known:/app/.well-known
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    container_name: issuer-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - backend
    networks:
      - issuer-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  issuer-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
