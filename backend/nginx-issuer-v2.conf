# /etc/nginx/sites-available/issuer.identia.my.id
# Issuer OID4VCI - Nginx Reverse Proxy
# Cloudflare SSL: Full | Frontend: 3000 | Backend API: 3001

# ── Upstream Definitions ──────────────────────────────────────
upstream issuer_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream issuer_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ── Server Block ──────────────────────────────────────────────
server {
    listen 80;
    server_name issuer.identia.my.id;

    # ── Cloudflare Real IP Restoration ───────────────────────
    # IPv4 ranges (ref: https://www.cloudflare.com/ips/)
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    # IPv6 ranges
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # ── Gzip Compression ─────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ── 1. OID4VCI Discovery Metadata -> Backend ─────────────
    # Wallet apps hit /.well-known/openid-credential-issuer etc.
    location /.well-known/ {
        proxy_pass         http://issuer_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_hide_header  X-Powered-By;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
    }

    # ── 2. Next.js Auth API Routes -> Frontend port 3000 ─────────
    # /api/auth/* adalah Next.js API route, HARUS ke frontend
    # Letakkan SEBELUM /api/ agar nginx prioritaskan blok ini
    location /api/auth/ {
        proxy_pass         http://issuer_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_hide_header  X-Powered-By;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout    30s;
        proxy_connect_timeout 10s;
    }

    # ── 3. API Routes -> Backend port 3001 ───────────────────
    # Strip /api/ prefix: /api/credential -> /credential
    location /api/ {
        proxy_pass         http://issuer_backend/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_hide_header  X-Powered-By;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout    86400s;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_buffering       off;
        client_max_body_size  10m;
    }

    # ── 4. Next.js Static Immutable Assets ───────────────────
    location ~* ^/_next/static/ {
        proxy_pass         http://issuer_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        expires             1y;
        add_header          Cache-Control "public, immutable";
        access_log          off;
    }

    # ── 5. Generic Static Files Caching ──────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        proxy_pass         http://issuer_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        expires             7d;
        add_header          Cache-Control "public, must-revalidate";
        access_log          off;
    }

    # ── 6. Frontend -> port 3000 ──────────────────────────────
    location / {
        proxy_pass         http://issuer_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_hide_header  X-Powered-By;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout    86400s;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
    }
}
